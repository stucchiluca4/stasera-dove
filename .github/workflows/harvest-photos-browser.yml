name: Raccogli foto (browser)

on:
  schedule:
    - cron: '30 5 1 * *'   # mensile, dopo il raccoglitore leggero
  workflow_dispatch:

permissions: {}

concurrency:
  group: harvest-photos
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Estrai foto con browser reale
        run: node scripts/harvest-photos-browser.mjs
